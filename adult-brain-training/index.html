<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f3f0ff">
  <title>大人的腦部鍛鍊</title>
  <style>
    :root{--bg:#f3f0ff;--ink:#4b00d7;--accent:#f28a35;--card:#fbfaff;--line:rgba(75,0,215,.18)}
    *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC","PingFang TC",sans-serif}
    main{width:min(100%,620px);margin:0 auto;padding:24px 18px 36px}
    .top{padding:12px 0 18px;border-bottom:2px solid var(--ink)}
    h1{margin:0;font-size:32px;letter-spacing:-.03em}
    .sub{margin:8px 0 0;font-weight:800;opacity:.7}
    .grid{display:grid;gap:14px;margin-top:22px}
    .card{background:var(--card);border:2px solid var(--line);border-radius:22px;padding:20px}
    .tag{font-size:12px;font-weight:900;letter-spacing:.12em;color:var(--accent)}
    h2{margin:6px 0 8px;font-size:24px}
    p{margin:0;line-height:1.7;font-weight:700;opacity:.76}
    .status{margin-top:24px;padding:16px 18px;border:2px dashed var(--accent);border-radius:18px;font-weight:900;color:var(--accent);text-align:center}
  </style>
</head>
<body>
  <main>
    <header class="top">
      <h1>大人的腦部鍛鍊</h1>
      <p class="sub">每日短時間 · 計算 · 記憶 · 邏輯</p>
    </header>
    <section class="grid">
      <article class="card"><div class="tag">01 / SPEED</div><h2>快速心算</h2><p>速度、正確率與難度逐階提升。</p></article>
      <article class="card"><div class="tag">02 / MEMORY</div><h2>瞬間記憶</h2><p>短時間記住數字、位置與順序，再立即回想。</p></article>
      <article class="card"><div class="tag">03 / LOGIC</div><h2>邏輯推理</h2><p>真假、排列、條件排除與短篇推理。</p></article>
    </section>
    <div class="status">新版本建置入口</div>
  </main>
</body>
</html>
