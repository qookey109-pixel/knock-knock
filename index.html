<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
  <meta name="theme-color" content="#ebe8ff" />
  <title>快速計算</title>
  <style>
    :root{
      --paper:#ebe8ff;
      --paper-2:#f4f1ff;
      --violet:#4b00d7;
      --orange:#f28a35;
      --violet-soft:rgba(75,0,215,.12);
    }
    *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
    html,body{
      margin:0;width:100%;height:100%;overflow:hidden;
      color:var(--violet);
      background:
        radial-gradient(circle at 12% 18%, rgba(242,138,53,.10) 0 1px, transparent 1.5px) 0 0/10px 10px,
        radial-gradient(circle at 88% 82%, rgba(75,0,215,.075) 0 1px, transparent 1.5px) 0 0/12px 12px,
        var(--paper);
    }
    body{
      font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC","PingFang TC",sans-serif;
      overscroll-behavior:none;
    }
    button{font:inherit;touch-action:manipulation}
    .app{
      position:relative;
      width:min(100%,520px);
      height:100dvh;
      margin:0 auto;
      padding:max(12px,env(safe-area-inset-top)) 10px max(10px,env(safe-area-inset-bottom));
      display:grid;
      grid-template-rows:auto auto minmax(120px,1fr) auto;
      gap:9px;
      overflow:hidden;
      isolation:isolate;
      background:
        radial-gradient(circle at 8% 32%, transparent 0 58px, rgba(75,0,215,.055) 59px 61px, transparent 62px 86px, rgba(75,0,215,.035) 87px 89px, transparent 90px),
        radial-gradient(circle at 93% 58%, transparent 0 72px, rgba(242,138,53,.065) 73px 75px, transparent 76px 105px, rgba(242,138,53,.035) 106px 108px, transparent 109px),
        repeating-linear-gradient(118deg, transparent 0 46px, rgba(75,0,215,.024) 47px 48px, transparent 49px 94px),
        repeating-linear-gradient(62deg, transparent 0 72px, rgba(242,138,53,.028) 73px 74px, transparent 75px 142px);
    }
    .app::before{
      content:"";
      position:absolute;
      width:250px;height:250px;
      right:-82px;top:62px;
      opacity:.28;
      z-index:-1;
      background-image:radial-gradient(circle,var(--orange) 1px,transparent 1.2px);
      background-size:7px 7px;
      transform:rotate(11deg);
      clip-path:polygon(18% 0,100% 0,100% 100%,0 84%);
    }
    .top{
      display:flex;
      align-items:flex-end;
      justify-content:space-between;
      min-height:34px;
      border-bottom:2px solid var(--violet);
      padding-bottom:7px;
    }
    .title{
      margin:0;
      font-size:21px;
      line-height:1;
      font-weight:900;
      letter-spacing:.02em;
    }
    .top-actions{display:flex;align-items:center;gap:10px}
    .mark{
      color:var(--orange);
      font-size:12px;
      line-height:1;
      font-weight:900;
      letter-spacing:.12em;
    }
    .sound{
      width:34px;height:34px;border:2px solid var(--violet);border-radius:50%;
      background:transparent;color:var(--violet);font-size:17px;line-height:1;font-weight:900;
      display:grid;place-items:center;padding:0;
    }
    .sound.off{color:var(--orange);border-color:var(--orange)}
    .hud{display:grid;grid-template-columns:1fr 1fr;gap:18px;padding-top:2px}
    .hud-item{
      display:flex;align-items:flex-end;justify-content:space-between;gap:8px;min-width:0;
      border-bottom:1.5px solid var(--violet);padding:0 1px 5px;
    }
    .hud-item span{font-size:9px;line-height:1;font-weight:900;letter-spacing:.12em;opacity:.68}
    .hud-item strong{
      font-size:28px;line-height:.9;font-weight:950;letter-spacing:-.05em;font-variant-numeric:tabular-nums;
    }
    .hud-item.score{border-bottom-color:var(--orange)}
    .hud-item.score strong{color:var(--orange)}
    .center{
      min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:2px 0;
    }
    .rules{
      margin:0 0 18px;
      font-size:15px;
      line-height:1.75;
      font-weight:850;
      letter-spacing:.03em;
      color:var(--violet);
    }
    .rules strong{
      color:var(--orange);
      font-size:18px;
    }
    .desktop-hint{
      display:none;
      margin-top:8px;
      font-size:11px;
      line-height:1.5;
      font-weight:800;
      letter-spacing:.04em;
      opacity:.7;
    }
    @media (hover:hover) and (pointer:fine){
      .desktop-hint{display:block}
    }
    .start{
      min-width:180px;min-height:66px;border:3px solid var(--orange);border-radius:999px;
      background:var(--orange);color:white;font-size:20px;font-weight:950;letter-spacing:.08em;
      box-shadow:8px 8px 0 var(--violet-soft);
    }
    .start:active{transform:translate(2px,2px);box-shadow:4px 4px 0 var(--violet-soft)}
    .problem{
      font-size:clamp(72px,21vw,112px);line-height:.86;font-weight:950;letter-spacing:-.08em;
      white-space:nowrap;text-rendering:geometricPrecision;
    }
    .problem.level-up{
      color:var(--orange);
      font-size:clamp(48px,15vw,74px);
      letter-spacing:-.04em;
    }
    .problem.compact{
      font-size:clamp(42px,12vw,72px);
      letter-spacing:-.055em;
    }
    .game-controls{display:none;min-height:0}
    .game-controls.show{display:grid;grid-template-rows:auto minmax(0,1fr);gap:9px}
    .answer-row{display:grid;grid-template-columns:minmax(0,1fr) 102px;gap:9px}
    .answer{
      height:56px;display:flex;align-items:center;justify-content:center;background:transparent;color:var(--violet);
      border:0;border-bottom:4px solid var(--violet);font-size:36px;line-height:1;font-weight:950;
      font-variant-numeric:tabular-nums;overflow:hidden;
    }
    .answer.empty{color:rgba(75,0,215,.34)}
    .submit{
      border:0;border-radius:0;background:var(--orange);color:white;font-size:15px;font-weight:950;letter-spacing:.05em;
    }
    .keypad{
      min-height:0;display:grid;grid-template-columns:repeat(3,1fr);
      grid-template-rows:repeat(4,minmax(82px,1fr));gap:9px;
    }
    .key{
      min-height:82px;border:3px solid var(--violet);border-radius:19px;background:rgba(244,241,255,.72);
      color:var(--violet);font-size:48px;line-height:1;font-weight:950;box-shadow:0 3px 0 rgba(75,0,215,.08);
    }
    .key.special{
      border-color:var(--orange);color:var(--orange);background:rgba(244,241,255,.54);font-size:13px;letter-spacing:.04em;
    }
    .key:active{background:var(--violet);color:var(--paper-2);transform:translateY(2px);box-shadow:none}
    .key.special:active{background:var(--orange);color:white}
    .submit:active{transform:scale(.98)}
    .result{
      position:absolute;inset:0;display:none;align-items:center;justify-content:center;padding:20px 18px;
      background:rgba(235,232,255,.98);z-index:10;overflow:auto;
    }
    .result.show{display:flex}
    .result-card{width:min(100%,390px);text-align:left;border-top:6px solid var(--orange);padding-top:16px}
    .result-label{display:block;font-size:10px;font-weight:950;letter-spacing:.18em;opacity:.55;margin-bottom:6px}
    .result-card strong{
      display:block;color:var(--violet);font-size:54px;line-height:.9;letter-spacing:-.06em;margin-bottom:8px;
    }
    .result-type{margin:0 0 16px;color:var(--orange);font-size:17px;line-height:1.3;font-weight:950}
    .result-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:16px}
    .result-stat{border:2px solid rgba(75,0,215,.18);padding:10px 11px;background:rgba(244,241,255,.55)}
    .result-stat span{display:block;font-size:9px;font-weight:950;letter-spacing:.11em;opacity:.58;margin-bottom:4px}
    .result-stat b{display:block;font-size:22px;line-height:1;font-weight:950;font-variant-numeric:tabular-nums}
    .result-section{border-top:1.5px solid rgba(75,0,215,.32);padding-top:11px;margin-bottom:13px}
    .result-section-title{font-size:10px;font-weight:950;letter-spacing:.12em;opacity:.58;margin-bottom:8px}
    .operation-stats{display:grid;grid-template-columns:1fr 1fr;gap:6px 14px}
    .operation-row{display:flex;justify-content:space-between;align-items:center;font-size:13px;font-weight:900}
    .operation-row span:first-child{color:var(--orange);font-size:17px}
    .result-note{margin:0 0 16px;font-size:12px;line-height:1.5;font-weight:850;opacity:.72}
    .result-card .start{width:100%;box-shadow:none}
    @media(min-height:780px){
      .keypad{grid-template-rows:repeat(4,minmax(92px,1fr))}
      .key{min-height:92px;font-size:54px}
    }
    @media(max-height:700px){
      .app{gap:6px;padding-top:8px;padding-bottom:8px}
      .top{min-height:28px;padding-bottom:5px}
      .title{font-size:18px}
      .mark{font-size:10px}
      .hud-item strong{font-size:23px}
      .problem{font-size:64px}
      .answer{height:48px;font-size:32px}
      .keypad{grid-template-rows:repeat(4,minmax(64px,1fr));gap:6px}
      .key{min-height:64px;font-size:40px}
      .start{min-height:58px}
    }
  </style>
</head>
<body>
  <main class="app">
    <header class="top">
      <h1 class="title">快速計算</h1>
      <div class="top-actions">
        <div id="levelMark" class="mark">LV 1 · 0/8</div>
        <button id="soundBtn" class="sound" type="button" aria-label="聲音開關">♪</button>
      </div>
    </header>
    <section class="hud" aria-label="狀態">
      <div class="hud-item"><span>TIME</span><strong id="timer">60</strong></div>
      <div class="hud-item score"><span>SCORE</span><strong id="score">0</strong></div>
    </section>
    <section class="center">
      <div id="rules" class="rules">
        60 秒一關<br>
        答對 <strong>8 題</strong> → 下一階<br>
        難度會逐階提升
        <span class="desktop-hint">電腦：數字鍵輸入 · Backspace 刪除 · Delete 清除 · Enter 送出</span>
      </div>
      <button id="startBtn" class="start" type="button">開始</button>
      <div id="playArea" hidden><div id="problem" class="problem"></div></div>
    </section>
    <section id="gameControls" class="game-controls">
      <div class="answer-row">
        <div id="answer" class="answer empty" role="status" aria-label="作答區"></div>
        <button id="submitBtn" class="submit" type="button">送出</button>
      </div>
      <div class="keypad" aria-label="數字鍵盤">
        <button class="key" type="button" data-key="1">1</button>
        <button class="key" type="button" data-key="2">2</button>
        <button class="key" type="button" data-key="3">3</button>
        <button class="key" type="button" data-key="4">4</button>
        <button class="key" type="button" data-key="5">5</button>
        <button class="key" type="button" data-key="6">6</button>
        <button class="key" type="button" data-key="7">7</button>
        <button class="key" type="button" data-key="8">8</button>
        <button class="key" type="button" data-key="9">9</button>
        <button id="clearBtn" class="key special" type="button">清除</button>
        <button class="key" type="button" data-key="0">0</button>
        <button id="backBtn" class="key special" type="button">←</button>
      </div>
    </section>
  </main>
  <section id="resultBox" class="result" aria-live="polite">
    <div class="result-card">
      <span class="result-label">RESULT</span>
      <strong id="resultScore">LV 1</strong>
      <p id="resultType" class="result-type">—</p>
      <div class="result-grid">
        <div class="result-stat"><span>總分</span><b id="resultTotalScore">0</b></div>
        <div class="result-stat"><span>正確率</span><b id="resultAccuracy">0%</b></div>
        <div class="result-stat"><span>平均反應</span><b id="resultAvgTime">—</b></div>
        <div class="result-stat"><span>最高連對</span><b id="resultMaxStreak">0</b></div>
      </div>
      <div class="result-section">
        <div class="result-section-title">四則表現</div>
        <div id="operationStats" class="operation-stats"></div>
      </div>
      <p id="resultText" class="result-note">—</p>
      <button id="restartBtn" class="start" type="button">再玩一次</button>
    </div>
  </section>
  <script>
    (() => {
      const $=id=>document.getElementById(id);
      const E={
        timer:$('timer'),score:$('score'),problem:$('problem'),answer:$('answer'),
        submit:$('submitBtn'),start:$('startBtn'),restart:$('restartBtn'),clear:$('clearBtn'),back:$('backBtn'),
        resultBox:$('resultBox'),resultScore:$('resultScore'),resultText:$('resultText'),resultType:$('resultType'),
        resultTotalScore:$('resultTotalScore'),resultAccuracy:$('resultAccuracy'),resultAvgTime:$('resultAvgTime'),
        resultMaxStreak:$('resultMaxStreak'),operationStats:$('operationStats'),
        playArea:$('playArea'),gameControls:$('gameControls'),sound:$('soundBtn'),levelMark:$('levelMark'),rules:$('rules')
      };
      const digitKeys=[...document.querySelectorAll('[data-key]')];

      const TARGET_PER_LEVEL=8;
      const LEVEL_SECONDS=60;

      let running=false,transitioning=false,remaining=LEVEL_SECONDS;
      let score=0,totalCorrect=0,totalWrong=0,streak=0,maxStreak=0,currentAnswer=0;
      let currentLevel=1,levelCorrect=0,value='',timerId=null,transitionId=null;
      let seenProblems=new Set(),currentOps=[],questionStartedAt=0,totalResponseMs=0,responseCount=0;
      let operationStats={'+':{tries:0,correct:0},'-':{tries:0,correct:0},'×':{tries:0,correct:0},'÷':{tries:0,correct:0}};
      let audioCtx=null,masterGain=null,bgmBuffer=null,bgmSource=null,bgmGain=null,bgmToken=0,muted=false;
      const BGM_URL='assets/rag-time-on-the-rag-loop.m4a';
      const bgmDataPromise=fetch(BGM_URL,{cache:'force-cache'}).then(r=>{if(!r.ok) throw new Error('BGM load failed');return r.arrayBuffer()}).catch(()=>null);

      const rnd=(a,b)=>Math.floor(Math.random()*(b-a+1))+a;

      function ensureAudio(){
        const AudioContextClass=window.AudioContext||window.webkitAudioContext;
        if(!AudioContextClass) return false;
        if(!audioCtx){
          audioCtx=new AudioContextClass();
          masterGain=audioCtx.createGain();
          masterGain.gain.value=.95;
          masterGain.connect(audioCtx.destination);
        }
        if(audioCtx.state==='suspended') audioCtx.resume();
        return true;
      }

      function tone(freq,duration=.06,type='sine',volume=.025,delay=0){
        if(muted||!ensureAudio()) return;
        const now=audioCtx.currentTime+delay;
        const osc=audioCtx.createOscillator();
        const gain=audioCtx.createGain();
        osc.type=type;
        osc.frequency.setValueAtTime(freq,now);
        gain.gain.setValueAtTime(.0001,now);
        gain.gain.exponentialRampToValueAtTime(Math.max(.0002,volume),now+.008);
        gain.gain.exponentialRampToValueAtTime(.0001,now+duration);
        osc.connect(gain);
        gain.connect(masterGain);
        osc.start(now);
        osc.stop(now+duration+.02);
      }

      function tapSound(){tone(520,.035,'square',.045)}
      function correctSound(){tone(660,.07,'sine',.065);tone(880,.09,'sine',.050,.045)}
      function wrongSound(){tone(185,.10,'triangle',.070)}
      function levelSound(){
        tone(523.25,.09,'sine',.060);
        tone(659.25,.09,'sine',.058,.08);
        tone(783.99,.15,'sine',.065,.16);
      }
      function finishSound(){
        tone(392,.12,'triangle',.060);
        tone(329.63,.16,'triangle',.055,.10);
      }
      function startSound(){
        tone(523.25,.06,'sine',.055);
        tone(659.25,.08,'sine',.050,.055);
      }

      async function loadBgm(){
        if(bgmBuffer) return bgmBuffer;
        if(!ensureAudio()) return null;
        const data=await bgmDataPromise;
        if(!data) return null;
        try{
          bgmBuffer=await audioCtx.decodeAudioData(data.slice(0));
          return bgmBuffer;
        }catch{
          return null;
        }
      }

      async function startBgm(){
        stopBgm();
        if(muted||!running||!ensureAudio()) return;
        const token=bgmToken;
        const buffer=await loadBgm();
        if(!buffer||muted||!running||token!==bgmToken) return;

        const source=audioCtx.createBufferSource();
        const gain=audioCtx.createGain();
        source.buffer=buffer;
        source.loop=true;
        gain.gain.value=.38;
        source.connect(gain);
        gain.connect(masterGain);
        source.start(0);
        bgmSource=source;
        bgmGain=gain;
      }

      function stopBgm(){
        bgmToken++;
        if(bgmSource){
          try{bgmSource.stop()}catch{}
          try{bgmSource.disconnect()}catch{}
          bgmSource=null;
        }
        if(bgmGain){
          try{bgmGain.disconnect()}catch{}
          bgmGain=null;
        }
      }

      function setValue(v){
        value=v.slice(0,7);
        E.answer.textContent=value||'';
        E.answer.classList.toggle('empty',!value);
      }

      function updateLevelMark(){
        E.levelMark.textContent=`LV ${currentLevel} · ${levelCorrect}/${TARGET_PER_LEVEL}`;
      }

      function problemKey(a,b,op){
        if(op==='+'||op==='×'){
          const x=Math.min(a,b);
          const y=Math.max(a,b);
          return `${op}:${x}:${y}`;
        }
        return `${op}:${a}:${b}`;
      }

      function generateProblem(lv){
        const make=(text,ans)=>({text,ans,key:text});
        let a,b,d,q,c1,c2,mode;

        if(lv===1){
          mode=rnd(0,1);
          if(mode===0){
            a=rnd(2,30); b=rnd(1,20);
            return make(`${a} + ${b}`,a+b);
          }
          a=rnd(8,40); b=rnd(1,a-1);
          return make(`${a} - ${b}`,a-b);
        }

        if(lv===2){
          mode=rnd(0,4);
          if(mode<=1){
            a=rnd(10,69); b=rnd(2,30);
            return make(`${a} + ${b}`,a+b);
          }
          if(mode===2){
            a=rnd(20,99); b=rnd(1,a-1);
            return make(`${a} - ${b}`,a-b);
          }
          if(mode===3){
            a=rnd(2,9); b=rnd(2,9);
            return make(`${a} × ${b}`,a*b);
          }
          d=rnd(2,9); q=rnd(2,9); a=d*q;
          return make(`${a} ÷ ${d}`,q);
        }

        if(lv===3){
          mode=rnd(0,3);
          if(mode===0){
            a=rnd(20,99); b=rnd(10,99);
            return make(`${a} + ${b}`,a+b);
          }
          if(mode===1){
            a=rnd(30,120); b=rnd(10,a-1);
            return make(`${a} - ${b}`,a-b);
          }
          if(mode===2){
            a=rnd(3,12); b=rnd(3,12);
            return make(`${a} × ${b}`,a*b);
          }
          d=rnd(2,12); q=rnd(3,12); a=d*q;
          return make(`${a} ÷ ${d}`,q);
        }

        if(lv===4){
          mode=rnd(0,3);
          if(mode===0){
            a=rnd(100,299); b=rnd(20,199);
            return make(`${a} + ${b}`,a+b);
          }
          if(mode===1){
            a=rnd(120,399); b=rnd(20,a-1);
            return make(`${a} - ${b}`,a-b);
          }
          if(mode===2){
            a=rnd(11,25); b=rnd(2,9);
            return make(`${a} × ${b}`,a*b);
          }
          d=rnd(2,12); q=rnd(10,30); a=d*q;
          return make(`${a} ÷ ${d}`,q);
        }

        if(lv===5){
          mode=rnd(0,5);
          if(mode===0){
            a=rnd(150,499); b=rnd(50,299);
            return make(`${a} + ${b}`,a+b);
          }
          if(mode===1){
            a=rnd(200,599); b=rnd(50,a-1);
            return make(`${a} - ${b}`,a-b);
          }
          if(mode===2){
            a=rnd(12,35); b=rnd(3,12);
            return make(`${a} × ${b}`,a*b);
          }
          if(mode===3){
            d=rnd(3,15); q=rnd(10,35); a=d*q;
            return make(`${a} ÷ ${d}`,q);
          }
          if(mode===4){
            a=rnd(40,199); b=rnd(20,99); c1=rnd(5,50);
            return make(`${a} + ${b} - ${c1}`,a+b-c1);
          }
          a=rnd(100,299); b=rnd(20,a-1); c1=rnd(5,60);
          return make(`${a} - ${b} + ${c1}`,a-b+c1);
        }

        if(lv===6){
          mode=rnd(0,5);
          if(mode===0){
            a=rnd(250,800); b=rnd(80,399);
            return make(`${a} + ${b}`,a+b);
          }
          if(mode===1){
            a=rnd(300,800); b=rnd(80,a-1);
            return make(`${a} - ${b}`,a-b);
          }
          if(mode===2){
            a=rnd(15,30); b=rnd(4,15);
            return make(`${a} × ${b}`,a*b);
          }
          if(mode===3){
            d=rnd(4,15); q=rnd(10,30); a=d*q;
            return make(`${a} ÷ ${d}`,q);
          }
          if(mode===4){
            a=rnd(180,500); b=rnd(80,250); c1=rnd(30,120);
            return make(`${a} + ${b} - ${c1}`,a+b-c1);
          }
          a=rnd(15,30); b=rnd(3,12); c1=rnd(10,80);
          return make(`${a} × ${b} + ${c1}`,a*b+c1);
        }

        if(lv===7){
          mode=rnd(0,6);
          if(mode===0){
            a=rnd(300,900); b=rnd(120,499);
            return make(`${a} + ${b}`,a+b);
          }
          if(mode===1){
            a=rnd(350,900); b=rnd(100,a-1);
            return make(`${a} - ${b}`,a-b);
          }
          if(mode===2){
            a=rnd(20,60); b=rnd(4,15);
            return make(`${a} × ${b}`,a*b);
          }
          if(mode===3){
            d=rnd(4,20); q=rnd(12,60); a=d*q;
            return make(`${a} ÷ ${d}`,q);
          }
          if(mode===4){
            a=rnd(250,650); b=rnd(100,350); c1=rnd(50,180);
            return make(`${a} + ${b} - ${c1}`,a+b-c1);
          }
          if(mode===5){
            a=rnd(20,60); b=rnd(4,15); c1=rnd(20,120);
            return make(`${a} × ${b} - ${c1}`,a*b-c1);
          }
          d=rnd(4,15); q=rnd(20,60); a=d*q; c1=rnd(20,120);
          return make(`${a} ÷ ${d} + ${c1}`,q+c1);
        }

        if(lv===8){
          mode=rnd(0,7);
          if(mode===0){
            a=rnd(400,999); b=rnd(150,599);
            return make(`${a} + ${b}`,a+b);
          }
          if(mode===1){
            a=rnd(450,999); b=rnd(120,a-1);
            return make(`${a} - ${b}`,a-b);
          }
          if(mode===2){
            a=rnd(30,90); b=rnd(5,18);
            return make(`${a} × ${b}`,a*b);
          }
          if(mode===3){
            d=rnd(5,20); q=rnd(20,90); a=d*q;
            return make(`${a} ÷ ${d}`,q);
          }
          if(mode===4){
            a=rnd(350,750); b=rnd(150,450); c1=rnd(80,260);
            return make(`${a} + ${b} - ${c1}`,a+b-c1);
          }
          if(mode===5){
            a=rnd(30,90); b=rnd(5,18); c1=rnd(30,180);
            return make(`${a} × ${b} + ${c1}`,a*b+c1);
          }
          if(mode===6){
            d=rnd(5,18); q=rnd(30,90); a=d*q; c1=rnd(30,180);
            return make(`${a} ÷ ${d} + ${c1}`,q+c1);
          }
          a=rnd(250,600); b=rnd(120,300); c1=rnd(50,160); c2=rnd(20,100);
          return make(`${a} + ${b} - ${c1} + ${c2}`,a+b-c1+c2);
        }

        if(lv===9){
          mode=rnd(0,7);
          if(mode===0){
            a=rnd(1000,1999); b=rnd(100,999);
            return make(`${a} + ${b}`,a+b);
          }
          if(mode===1){
            a=rnd(1200,1999); b=rnd(100,a-1);
            return make(`${a} - ${b}`,a-b);
          }
          if(mode===2){
            a=rnd(100,299); b=rnd(2,12);
            return make(`${a} × ${b}`,a*b);
          }
          if(mode===3){
            do{
              d=rnd(3,18); q=rnd(10,99); a=d*q;
            }while(a<100||a>999);
            return make(`${a} ÷ ${d}`,q);
          }
          if(mode===4){
            a=rnd(1000,1800); b=rnd(200,800); c1=rnd(80,350);
            return make(`${a} + ${b} - ${c1}`,a+b-c1);
          }
          if(mode===5){
            a=rnd(100,299); b=rnd(2,12); c1=rnd(20,150);
            return make(`${a} × ${b} + ${c1}`,a*b+c1);
          }
          if(mode===6){
            do{
              d=rnd(3,18); q=rnd(10,99); a=d*q;
            }while(a<100||a>999);
            c1=rnd(20,150);
            return make(`${a} ÷ ${d} + ${c1}`,q+c1);
          }
          a=rnd(1000,1600); b=rnd(200,700); c1=rnd(100,400); c2=rnd(30,180);
          return make(`${a} + ${b} - ${c1} + ${c2}`,a+b-c1+c2);
        }

        const extra=lv-10;
        const addMax=Math.min(9999,2999+extra*1000);
        const mulMax=Math.min(999,399+extra*100);
        mode=rnd(0,5);

        if(mode===0){
          a=rnd(1200,addMax); b=rnd(300,Math.max(500,addMax-500));
          return make(`${a} + ${b}`,a+b);
        }
        if(mode===1){
          a=rnd(1500,addMax); b=rnd(200,a-1);
          return make(`${a} - ${b}`,a-b);
        }
        if(mode===2){
          a=rnd(100,mulMax); b=rnd(3,20);
          return make(`${a} × ${b}`,a*b);
        }
        if(mode===3){
          do{
            d=rnd(3,25); q=rnd(20,Math.min(199,mulMax)); a=d*q;
          }while(a<100||a>9999);
          return make(`${a} ÷ ${d}`,q);
        }
        if(mode===4){
          a=rnd(1200,addMax); b=rnd(300,900); c1=rnd(100,500);
          return make(`${a} + ${b} - ${c1}`,a+b-c1);
        }
        a=rnd(100,mulMax); b=rnd(3,20); c1=rnd(50,250);
        return make(`${a} × ${b} + ${c1}`,a*b+c1);
      }

      function makeProblem(){
        transitioning=false;
        E.problem.classList.remove('level-up','compact');

        let p=null;

        for(let attempt=0;attempt<200;attempt++){
          p=generateProblem(currentLevel);
          if(!seenProblems.has(p.key)) break;
        }

        seenProblems.add(p.key);
        currentAnswer=p.ans;
        currentOps=['+','-','×','÷'].filter(op=>p.text.includes(` ${op} `));
        questionStartedAt=performance.now();
        E.problem.textContent=p.text;
        E.problem.classList.toggle('compact',p.text.length>10);
        setValue('');
      }

      function startLevelTimer(){
        clearInterval(timerId);
        remaining=LEVEL_SECONDS;
        E.timer.textContent=String(LEVEL_SECONDS);
        timerId=setInterval(()=>{
          remaining--;
          E.timer.textContent=String(Math.max(0,remaining));
          if(remaining<=0) finish();
        },1000);
      }

      function advanceLevel(){
        transitioning=true;
        clearInterval(timerId);
        levelSound();

        const timeBonus=remaining*2;
        score+=timeBonus;
        E.score.textContent=String(score);

        currentLevel++;
        levelCorrect=0;
        updateLevelMark();
        setValue('');
        E.problem.textContent=`LEVEL ${currentLevel}`;
        E.problem.classList.add('level-up');

        clearTimeout(transitionId);
        transitionId=setTimeout(()=>{
          if(!running) return;
          makeProblem();
          startLevelTimer();
        },650);
      }

      function submit(){
        if(!running||transitioning||value==='') return;
        const val=Number(value);
        const responseMs=Math.max(0,performance.now()-questionStartedAt);
        totalResponseMs+=responseMs;
        responseCount++;
        currentOps.forEach(op=>operationStats[op].tries++);

        if(val===currentAnswer){
          currentOps.forEach(op=>operationStats[op].correct++);
          totalCorrect++;
          levelCorrect++;
          streak++;
          maxStreak=Math.max(maxStreak,streak);
          score+=10+Math.min(streak,10)+currentLevel;
          E.score.textContent=String(score);
          correctSound();
          updateLevelMark();

          if(levelCorrect>=TARGET_PER_LEVEL){
            advanceLevel();
          }else{
            makeProblem();
          }
        }else{
          totalWrong++;
          streak=0;
          score=Math.max(0,score-3);
          E.score.textContent=String(score);
          wrongSound();
          setValue('');
          makeProblem();
        }
      }

      function finish(){
        running=false;
        transitioning=false;
        clearInterval(timerId);
        clearTimeout(transitionId);
        stopBgm();
        E.timer.textContent='0';

        const tries=totalCorrect+totalWrong;
        const acc=tries?Math.round(totalCorrect/tries*100):0;
        const avgSec=responseCount?totalResponseMs/responseCount/1000:0;
        let type='挑戰進階型';
        if(acc>=92&&avgSec>0&&avgSec<=5) type='高速穩定型';
        else if(acc>=92) type='精準穩定型';
        else if(acc>=78&&avgSec>0&&avgSec<=4.5) type='快速反應型';
        else if(acc>=82&&avgSec>0&&avgSec<=7) type='均衡型';

        E.resultScore.textContent=`LV ${currentLevel}`;
        E.resultType.textContent=type;
        E.resultTotalScore.textContent=String(score);
        E.resultAccuracy.textContent=`${acc}%`;
        E.resultAvgTime.textContent=responseCount?`${avgSec.toFixed(1)}s`:'—';
        E.resultMaxStreak.textContent=String(maxStreak);
        E.resultText.textContent=`答對 ${totalCorrect} 題 · 答錯 ${totalWrong} 題 · 共作答 ${tries} 題`;

        const labels={'+':'加','-':'減','×':'乘','÷':'除'};
        E.operationStats.innerHTML=['+','-','×','÷'].map(op=>{
          const stat=operationStats[op];
          const pct=stat.tries?Math.round(stat.correct/stat.tries*100):null;
          return `<div class="operation-row"><span>${labels[op]}</span><span>${pct===null?'—':`${stat.correct}/${stat.tries} · ${pct}%`}</span></div>`;
        }).join('');

        E.resultBox.classList.add('show');
        finishSound();
      }

      function start(){
        clearInterval(timerId);
        clearTimeout(transitionId);

        running=true;
        transitioning=false;
        ensureAudio();
        remaining=LEVEL_SECONDS;
        score=0;
        totalCorrect=0;
        totalWrong=0;
        streak=0;
        maxStreak=0;
        currentLevel=1;
        levelCorrect=0;
        seenProblems=new Set();
        currentOps=[];
        questionStartedAt=0;
        totalResponseMs=0;
        responseCount=0;
        operationStats={'+':{tries:0,correct:0},'-':{tries:0,correct:0},'×':{tries:0,correct:0},'÷':{tries:0,correct:0}};

        E.timer.textContent=String(LEVEL_SECONDS);
        E.score.textContent='0';
        E.start.hidden=true;
        E.rules.hidden=true;
        E.playArea.hidden=false;
        E.gameControls.classList.add('show');
        E.resultBox.classList.remove('show');

        updateLevelMark();
        makeProblem();
        startSound();
        startLevelTimer();
        startBgm();
      }

      E.start.addEventListener('click',start);
      E.restart.addEventListener('click',()=>{
        E.resultBox.classList.remove('show');
        start();
      });
      E.submit.addEventListener('click',()=>{if(running&&!transitioning&&value!=='') submit()});
      E.clear.addEventListener('click',()=>{if(running&&!transitioning){tapSound();setValue('')}});
      E.back.addEventListener('click',()=>{if(running&&!transitioning){tapSound();setValue(value.slice(0,-1))}});
      digitKeys.forEach(btn=>btn.addEventListener('click',()=>{
        if(running&&!transitioning){tapSound();setValue(value+btn.dataset.key)}
      }));

      document.addEventListener('keydown',event=>{
        if(!running||transitioning||event.ctrlKey||event.metaKey||event.altKey) return;

        if(/^\d$/.test(event.key)){
          event.preventDefault();
          tapSound();
          setValue(value+event.key);
          return;
        }

        if(event.key==='Backspace'){
          event.preventDefault();
          tapSound();
          setValue(value.slice(0,-1));
          return;
        }

        if(event.key==='Delete'){
          event.preventDefault();
          tapSound();
          setValue('');
          return;
        }

        if(event.key==='Enter'){
          event.preventDefault();
          if(value!=='') submit();
        }
      });

      E.sound.addEventListener('click',()=>{
        muted=!muted;
        E.sound.textContent=muted?'×':'♪';
        E.sound.classList.toggle('off',muted);
        E.sound.setAttribute('aria-label',muted?'開啟聲音':'關閉聲音');
        if(muted){
          stopBgm();
        }else{
          ensureAudio();
          tone(660,.06,'sine',.02);
          if(running) startBgm();
        }
      });

      updateLevelMark();
    })();
  </script>
</body>
</html>
