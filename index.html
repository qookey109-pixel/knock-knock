<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
  <meta name="theme-color" content="#ebe8ff" />
  <title>快速計算</title>
  <style>
    :root{
      --paper:#ebe8ff;
      --paper-2:#f4f1ff;
      --violet:#4b00d7;
      --orange:#f28a35;
      --violet-soft:rgba(75,0,215,.12);
      --orange-soft:rgba(242,138,53,.16);
    }
    *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
    html,body{
      margin:0;width:100%;height:100%;overflow:hidden;
      color:var(--violet);
      background:
        radial-gradient(circle at 12% 18%, rgba(242,138,53,.10) 0 1px, transparent 1.5px) 0 0/10px 10px,
        radial-gradient(circle at 88% 82%, rgba(75,0,215,.075) 0 1px, transparent 1.5px) 0 0/12px 12px,
        var(--paper);
    }
    body{
      font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC","PingFang TC",sans-serif;
      overscroll-behavior:none;
    }
    button{font:inherit;touch-action:manipulation}

    .app{
      position:relative;
      width:min(100%,520px);
      height:100dvh;
      margin:0 auto;
      padding:max(12px,env(safe-area-inset-top)) 16px max(12px,env(safe-area-inset-bottom));
      display:grid;
      grid-template-rows:auto auto minmax(120px,1fr) auto;
      gap:9px;
      overflow:hidden;
      isolation:isolate;
      background:
        radial-gradient(circle at 8% 32%, transparent 0 58px, rgba(75,0,215,.055) 59px 61px, transparent 62px 86px, rgba(75,0,215,.035) 87px 89px, transparent 90px),
        radial-gradient(circle at 93% 58%, transparent 0 72px, rgba(242,138,53,.065) 73px 75px, transparent 76px 105px, rgba(242,138,53,.035) 106px 108px, transparent 109px),
        repeating-linear-gradient(118deg, transparent 0 46px, rgba(75,0,215,.024) 47px 48px, transparent 49px 94px),
        repeating-linear-gradient(62deg, transparent 0 72px, rgba(242,138,53,.028) 73px 74px, transparent 75px 142px);
    }

    .app::before{
      content:"";
      position:absolute;
      width:250px;height:250px;
      right:-82px;top:62px;
      opacity:.28;
      z-index:-1;
      background-image:radial-gradient(circle,var(--orange) 1px,transparent 1.2px);
      background-size:7px 7px;
      transform:rotate(11deg);
      clip-path:polygon(18% 0,100% 0,100% 100%,0 84%);
    }

    .app::after{
      content:"";
      position:absolute;
      left:-72px;bottom:58px;
      width:220px;height:220px;
      border:2px solid var(--violet);
      border-radius:50%;
      opacity:.18;
      box-shadow:
        0 0 0 24px rgba(75,0,215,.025),
        0 0 0 48px rgba(242,138,53,.022);
      z-index:-1;
    }

    .top{
      display:flex;
      align-items:flex-end;
      justify-content:space-between;
      min-height:34px;
      border-bottom:2px solid var(--violet);
      padding-bottom:7px;
    }
    .title{
      margin:0;
      font-size:21px;
      line-height:1;
      font-weight:900;
      letter-spacing:.02em;
    }
    .top-actions{
      display:flex;
      align-items:center;
      gap:10px;
    }
    .mark{
      color:var(--orange);
      font-size:12px;
      line-height:1;
      font-weight:900;
      letter-spacing:.12em;
    }
    .sound{
      width:34px;
      height:34px;
      border:2px solid var(--violet);
      border-radius:50%;
      background:transparent;
      color:var(--violet);
      font-size:17px;
      line-height:1;
      font-weight:900;
      display:grid;
      place-items:center;
      padding:0;
    }
    .sound.off{
      color:var(--orange);
      border-color:var(--orange);
    }

    .hud{
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:18px;
      padding-top:2px;
    }
    .hud-item{
      display:flex;
      align-items:flex-end;
      justify-content:space-between;
      gap:8px;
      min-width:0;
      border-bottom:1.5px solid var(--violet);
      padding:0 1px 5px;
    }
    .hud-item span{
      font-size:9px;
      line-height:1;
      font-weight:900;
      letter-spacing:.12em;
      opacity:.68;
    }
    .hud-item strong{
      font-size:28px;
      line-height:.9;
      font-weight:950;
      letter-spacing:-.05em;
      font-variant-numeric:tabular-nums;
    }
    .hud-item.score{border-bottom-color:var(--orange)}
    .hud-item.score strong{color:var(--orange)}

    .center{
      min-height:0;
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:center;
      text-align:center;
      padding:2px 0;
    }
    .start{
      min-width:180px;
      min-height:66px;
      border:3px solid var(--orange);
      border-radius:999px;
      background:var(--orange);
      color:white;
      font-size:20px;
      font-weight:950;
      letter-spacing:.08em;
      box-shadow:8px 8px 0 var(--violet-soft);
    }
    .start:active{transform:translate(2px,2px);box-shadow:4px 4px 0 var(--violet-soft)}

    .problem{
      font-size:clamp(72px,21vw,112px);
      line-height:.86;
      font-weight:950;
      letter-spacing:-.08em;
      white-space:nowrap;
      text-rendering:geometricPrecision;
    }
    .feedback{display:none}

    .game-controls{
      display:none;
      min-height:0;
    }
    .game-controls.show{
      display:grid;
      grid-template-rows:auto minmax(0,1fr);
      gap:9px;
    }

    .answer-row{
      display:grid;
      grid-template-columns:minmax(0,1fr) 102px;
      gap:9px;
    }
    .answer{
      height:56px;
      display:flex;
      align-items:center;
      justify-content:center;
      background:transparent;
      color:var(--violet);
      border:0;
      border-bottom:4px solid var(--violet);
      font-size:36px;
      line-height:1;
      font-weight:950;
      font-variant-numeric:tabular-nums;
      overflow:hidden;
    }
    .answer.empty{color:rgba(75,0,215,.34)}
    .submit{
      border:0;
      border-radius:0;
      background:var(--orange);
      color:white;
      font-size:15px;
      font-weight:950;
      letter-spacing:.05em;
    }

    .keypad{
      min-height:0;
      display:grid;
      grid-template-columns:repeat(3,1fr);
      grid-template-rows:repeat(4,minmax(60px,1fr));
      gap:8px;
    }
    .key{
      min-height:60px;
      border:2.5px solid var(--violet);
      border-radius:16px;
      background:rgba(244,241,255,.72);
      color:var(--violet);
      font-size:36px;
      line-height:1;
      font-weight:950;
      box-shadow:0 3px 0 rgba(75,0,215,.08);
    }
    .key.special{
      border-color:var(--orange);
      color:var(--orange);
      background:rgba(244,241,255,.54);
      font-size:13px;
      letter-spacing:.04em;
    }
    .key:active{
      background:var(--violet);
      color:var(--paper-2);
      transform:translateY(2px);
      box-shadow:none;
    }
    .key.special:active{
      background:var(--orange);
      color:white;
    }
    .submit:active{transform:scale(.98)}

    .result{
      position:absolute;
      inset:0;
      display:none;
      align-items:center;
      justify-content:center;
      padding:24px;
      background:rgba(235,232,255,.98);
      z-index:10;
    }
    .result.show{display:flex}
    .result-card{
      width:min(100%,360px);
      text-align:left;
      border-top:6px solid var(--orange);
      padding-top:18px;
    }
    .result-card strong{
      display:block;
      color:var(--violet);
      font-size:54px;
      line-height:.9;
      letter-spacing:-.06em;
      margin-bottom:12px;
    }
    .result-card p{
      margin:0 0 24px;
      color:var(--orange);
      font-size:15px;
      line-height:1.5;
      font-weight:900;
    }
    .result-card .start{
      width:100%;
      box-shadow:none;
    }

    @media(min-height:780px){
      .keypad{grid-template-rows:repeat(4,minmax(68px,1fr))}
      .key{min-height:68px;font-size:40px}
    }
    @media(max-height:700px){
      .app{gap:6px;padding-top:8px;padding-bottom:8px}
      .top{min-height:28px;padding-bottom:5px}
      .title{font-size:18px}
      .mark{font-size:10px}
      .hud-item strong{font-size:23px}
      .problem{font-size:64px}
      .answer{height:48px;font-size:32px}
      .keypad{grid-template-rows:repeat(4,minmax(51px,1fr));gap:6px}
      .key{min-height:51px;font-size:32px}
      .start{min-height:58px}
    }
  </style>
</head>
<body>
  <main class="app">
    <header class="top">
      <h1 class="title">快速計算</h1>
      <div class="top-actions">
        <div class="mark">60 SEC</div>
        <button id="soundBtn" class="sound" type="button" aria-label="聲音開關">♪</button>
      </div>
    </header>

    <section class="hud" aria-label="狀態">
      <div class="hud-item">
        <span>TIME</span>
        <strong id="timer">60</strong>
      </div>
      <div class="hud-item score">
        <span>SCORE</span>
        <strong id="score">0</strong>
      </div>
    </section>

    <section class="center">
      <button id="startBtn" class="start" type="button">開始</button>

      <div id="playArea" hidden>
        <div id="problem" class="problem"></div>
      </div>
    </section>

    <section id="gameControls" class="game-controls">
      <div class="answer-row">
        <div id="answer" class="answer empty" role="status" aria-label="作答區"></div>
        <button id="submitBtn" class="submit" type="button">送出</button>
      </div>

      <div class="keypad" aria-label="數字鍵盤">
        <button class="key" type="button" data-key="1">1</button>
        <button class="key" type="button" data-key="2">2</button>
        <button class="key" type="button" data-key="3">3</button>
        <button class="key" type="button" data-key="4">4</button>
        <button class="key" type="button" data-key="5">5</button>
        <button class="key" type="button" data-key="6">6</button>
        <button class="key" type="button" data-key="7">7</button>
        <button class="key" type="button" data-key="8">8</button>
        <button class="key" type="button" data-key="9">9</button>
        <button id="clearBtn" class="key special" type="button">清除</button>
        <button class="key" type="button" data-key="0">0</button>
        <button id="backBtn" class="key special" type="button">←</button>
      </div>
    </section>
  </main>

  <section id="resultBox" class="result" aria-live="polite">
    <div class="result-card">
      <strong id="resultScore">0 分</strong>
      <p id="resultText">—</p>
      <button id="restartBtn" class="start" type="button">再玩一次</button>
    </div>
  </section>

  <script>
    (() => {
      const $=id=>document.getElementById(id);
      const E={
        timer:$('timer'),score:$('score'),problem:$('problem'),answer:$('answer'),
        submit:$('submitBtn'),start:$('startBtn'),
        restart:$('restartBtn'),clear:$('clearBtn'),back:$('backBtn'),
        resultBox:$('resultBox'),resultScore:$('resultScore'),resultText:$('resultText'),
        playArea:$('playArea'),gameControls:$('gameControls'),sound:$('soundBtn')
      };
      const digitKeys=[...document.querySelectorAll('[data-key]')];

      let running=false,remaining=60,score=0,correct=0,wrong=0,streak=0,currentAnswer=0;
      let value='',timerId=null,nextId=null;
      let audioCtx=null,masterGain=null,bgmTimer=null,bgmStep=0,muted=false;

      const rnd=(a,b)=>Math.floor(Math.random()*(b-a+1))+a;
      const level=()=>Math.min(8,1+Math.floor(correct/5));

      function ensureAudio(){
        const AudioContextClass=window.AudioContext||window.webkitAudioContext;
        if(!AudioContextClass) return false;
        if(!audioCtx){
          audioCtx=new AudioContextClass();
          masterGain=audioCtx.createGain();
          masterGain.gain.value=.72;
          masterGain.connect(audioCtx.destination);
        }
        if(audioCtx.state==='suspended') audioCtx.resume();
        return true;
      }

      function tone(freq,duration=.06,type='sine',volume=.025,delay=0){
        if(muted||!ensureAudio()) return;
        const now=audioCtx.currentTime+delay;
        const osc=audioCtx.createOscillator();
        const gain=audioCtx.createGain();
        osc.type=type;
        osc.frequency.setValueAtTime(freq,now);
        gain.gain.setValueAtTime(.0001,now);
        gain.gain.exponentialRampToValueAtTime(Math.max(.0002,volume),now+.008);
        gain.gain.exponentialRampToValueAtTime(.0001,now+duration);
        osc.connect(gain);
        gain.connect(masterGain);
        osc.start(now);
        osc.stop(now+duration+.02);
      }

      function tapSound(){
        tone(520,.028,'square',.010);
      }

      function correctSound(){
        tone(660,.055,'sine',.024);
        tone(880,.07,'sine',.018,.045);
      }

      function wrongSound(){
        tone(185,.08,'triangle',.025);
      }

      function finishSound(){
        tone(523.25,.10,'sine',.025);
        tone(659.25,.10,'sine',.023,.10);
        tone(783.99,.18,'sine',.026,.20);
      }

      function bgmTick(){
        if(!running||muted) return;
        const melody=[261.63,329.63,392.00,329.63,293.66,349.23,440.00,349.23];
        const bass=[130.81,146.83,164.81,146.83];
        tone(melody[bgmStep%melody.length],.16,'triangle',.007);
        if(bgmStep%2===0) tone(bass[(bgmStep/2)%bass.length|0],.22,'sine',.005);
        bgmStep++;
      }

      function startBgm(){
        stopBgm();
        if(muted||!running||!ensureAudio()) return;
        bgmStep=0;
        bgmTick();
        bgmTimer=setInterval(bgmTick,375);
      }

      function stopBgm(){
        if(bgmTimer){
          clearInterval(bgmTimer);
          bgmTimer=null;
        }
      }

      function setValue(v){
        value=v.slice(0,6);
        E.answer.textContent=value||'';
        E.answer.classList.toggle('empty',!value);
      }

      function makeProblem(){
        const lv=level();
        let a,b,op,ans;
        const pool=lv<3?['+','-']:lv<5?['+','-','×']:['+','-','×','÷'];
        op=pool[rnd(0,pool.length-1)];

        if(op==='+'){
          const m=lv<2?20:lv<4?50:100;
          a=rnd(2,m);b=rnd(2,m);ans=a+b;
        }else if(op==='-'){
          const m=lv<2?20:lv<4?60:120;
          a=rnd(5,m);b=rnd(1,a);ans=a-b;
        }else if(op==='×'){
          const m=lv<5?9:12;
          a=rnd(2,m);b=rnd(2,m);ans=a*b;
        }else{
          b=rnd(2,lv<7?9:12);
          ans=rnd(2,lv<7?9:12);
          a=b*ans;
        }

        currentAnswer=ans;
        E.problem.textContent=`${a} ${op} ${b}`;
        setValue('');
      }

      function submit(){
        if(!running||value==='') return;
        const val=Number(value);

        if(val===currentAnswer){
          correct++;
          streak++;
          score+=10+Math.min(streak,10);
          E.score.textContent=String(score);
          correctSound();
          makeProblem();
        }else{
          wrong++;
          streak=0;
          score=Math.max(0,score-3);
          E.score.textContent=String(score);
          wrongSound();
          setValue('');
          makeProblem();
        }
      }

      function finish(){
        running=false;
        clearInterval(timerId);
        clearTimeout(nextId);
        stopBgm();
        E.timer.textContent='0';

        const tries=correct+wrong;
        const acc=tries?Math.round(correct/tries*100):0;
        E.resultScore.textContent=`${score} 分`;
        E.resultText.textContent=`答對 ${correct} 題 · 正確率 ${acc}%`;
        E.resultBox.classList.add('show');
        finishSound();
      }

      function start(){
        clearInterval(timerId);
        clearTimeout(nextId);

        running=true;
        ensureAudio();
        remaining=60;
        score=0;
        correct=0;
        wrong=0;
        streak=0;

        E.timer.textContent='60';
        E.score.textContent='0';
        E.start.hidden=true;
        E.playArea.hidden=false;
        E.gameControls.classList.add('show');
        E.resultBox.classList.remove('show');

        makeProblem();
        startBgm();

        timerId=setInterval(()=>{
          remaining--;
          E.timer.textContent=String(Math.max(0,remaining));
          if(remaining<=0) finish();
        },1000);
      }

      E.start.addEventListener('click',start);
      E.restart.addEventListener('click',()=>{
        E.resultBox.classList.remove('show');
        start();
      });
      E.submit.addEventListener('click',()=>{
        if(running&&value!=='') submit();
      });
      E.clear.addEventListener('click',()=>{
        if(running){
          tapSound();
          setValue('');
        }
      });
      E.back.addEventListener('click',()=>{
        if(running){
          tapSound();
          setValue(value.slice(0,-1));
        }
      });
      digitKeys.forEach(btn=>btn.addEventListener('click',()=>{
        if(running){
          tapSound();
          setValue(value+btn.dataset.key);
        }
      }));
      E.sound.addEventListener('click',()=>{
        muted=!muted;
        E.sound.textContent=muted?'×':'♪';
        E.sound.classList.toggle('off',muted);
        E.sound.setAttribute('aria-label',muted?'開啟聲音':'關閉聲音');
        if(muted){
          stopBgm();
        }else{
          ensureAudio();
          tone(660,.06,'sine',.02);
          if(running) startBgm();
        }
      });
    })();
  </script>
</body>
</html>
